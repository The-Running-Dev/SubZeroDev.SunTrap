name: Docs Deploy

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  deploy:
    name: Build and Deploy Documentation
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    container:
      image: ghcr.io/the-running-dev/docs-template@sha256:1ed8c8b001a0175204cbb8568d9cb018d1f6145fe40b8a209f8179c640d2ffa7
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.REGISTRY_TOKEN || github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Markdown links, terminology, and generated files
        run: ./build/Test-Documentation.ps1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Build documentation
        run: |
          Remove-Item -LiteralPath /template/src/pages -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path /template/src/pages -Force | Out-Null
          Copy-Item -LiteralPath ./documentation/src/pages/index.md -Destination /template/src/pages/index.md -Force
          /template/scripts/docs-build.ps1 -SourceDocs ./documentation -OutputPath artifacts/docs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
